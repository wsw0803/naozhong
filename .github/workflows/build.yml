name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bump patch version
        id: ver
        run: |
          git fetch --tags --force
          FILE=app/build.gradle.kts
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$FILE" | head -1)
          CUR=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$FILE" | head -1)
          LATEST=$(git tag -l 'v*' | sort -V | tail -1)
          BASE=${LATEST#v}
          if [ -z "$BASE" ]; then BASE=$CUR; fi
          IFS='.' read -r MAJ MIN PAT <<< "$BASE"
          MAJ=${MAJ:-0}; MIN=${MIN:-0}; PAT=${PAT:-0}
          PAT=$((PAT+1))
          NEW="$MAJ.$MIN.$PAT"
          CODE=$((CODE+1))
          sed -i "s/versionCode = .*/versionCode = $CODE/" "$FILE"
          sed -i "s/versionName = \".*\"/versionName = \"$NEW\"/" "$FILE"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEW (code $CODE)"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/naozhong-v${{ steps.ver.outputs.version }}.apk"
          ls -l out

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: naozhong v${{ steps.ver.outputs.version }}
          files: out/naozhong-v${{ steps.ver.outputs.version }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
